name: Release

on:
  push:
    tags:
      - 'v[0-9]*'   # triggers on v1.0, v1.2.3, etc.

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  release:
    name: Build & publish release
    runs-on: macos-14   # Apple Silicon — arm64-only target

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          XCODE=$(ls /Applications | grep "^Xcode" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build release binary
        run: swift build -c release --arch arm64

      - name: Assemble .app bundle
        run: |
          APP=EdexUI.app
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp .build/release/EdexUI                        "$APP/Contents/MacOS/EdexUI"
          cp Sources/EdexUI/Info.plist                    "$APP/Contents/Info.plist"
          cp Sources/EdexUI/Resources/AppIcon.icns        "$APP/Contents/Resources/AppIcon.icns"
          # Stamp the git tag into the bundle version
          TAG="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $TAG" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TAG"            "$APP/Contents/Info.plist"

      - name: Ad-hoc code sign
        run: codesign --force --deep --sign - EdexUI.app

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R EdexUI.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "EdexUI" \
            -srcfolder dmg-staging \
            -ov \
            -format UDZO \
            "EdexUI-${GITHUB_REF_NAME}-arm64.dmg"

      - name: Compute SHA-256 checksum
        run: |
          DMG="EdexUI-${GITHUB_REF_NAME}-arm64.dmg"
          shasum -a 256 "$DMG" | awk '{print $1}' > "${DMG}.sha256"
          echo "SHA256=$(cat ${DMG}.sha256)" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
          body: |
            ## Installation

            1. Download **${{ env.DMG_NAME }}**
            2. Open the DMG and drag **EdexUI.app** to Applications
            3. Right-click the app and choose **Open** on first launch
               (required because the app is ad-hoc signed, not notarized)

            **SHA-256:** `${{ env.SHA256 }}`

            **Requirements:** Apple Silicon Mac (M1 or later), macOS 14.0+
